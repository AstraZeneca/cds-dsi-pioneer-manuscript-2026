name: Tests

on:
  push:
    branches: [ main, karim/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disable Domino config files in CI
        run: |
          # .Renviron has Domino-specific paths, .Rprofile loads packages at startup
          [ -f .Renviron ] && mv .Renviron .Renviron.domino
          [ -f .Rprofile ] && mv .Rprofile .Rprofile.domino

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.3.2-test-deps-v1
          restore-keys: |
            ${{ runner.os }}-r-4.3.2-test-deps-

      - name: Install R test dependencies
        run: |
          # Install only what tests actually need (not the full 272-package renv.lock)
          Rscript -e "
            pkgs <- c(
              'testthat', 'here', 'posterior',
              'tidyverse', 'tidybayes', 'recipes',
              'conflicted', 'stringr',
              'patchwork', 'ggdist', 'scales', 'cmprsk', 'survival'
            )
            install.packages(pkgs, repos = 'https://packagemanager.posit.co/cran/__linux__/jammy/latest')
          "

      - name: Install cmdstanr
        run: Rscript -e "install.packages('cmdstanr', repos = c('https://stan-dev.r-universe.dev', 'https://packagemanager.posit.co/cran/__linux__/jammy/latest'))"

      - name: Cache CmdStan
        uses: actions/cache@v4
        id: cmdstan-cache
        with:
          path: ~/.cmdstan
          key: ${{ runner.os }}-cmdstan-2.38.0

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: Rscript -e "cmdstanr::install_cmdstan(version = '2.38.0', cores = 2)"

      - name: Run tests (Quick - Push)
        if: github.event_name == 'push'
        run: |
          Rscript -e "testthat::test_dir('tests/testthat', filter = '^helper|^multistate|^trial-data', perl = TRUE)"
        env:
          CMDSTAN: ~/.cmdstan/cmdstan-2.38.0

      - name: Run tests (Full - PR)
        if: github.event_name == 'pull_request'
        run: |
          Rscript -e "testthat::test_dir('tests/testthat', filter = '^(?!integration)', perl = TRUE)"
        env:
          CMDSTAN: ~/.cmdstan/cmdstan-2.38.0

      - name: Test summary
        if: always()
        run: echo "Tests completed. Check logs above for results."
