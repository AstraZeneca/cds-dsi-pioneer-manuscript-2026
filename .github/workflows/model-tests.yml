name: Model Tests

on:
  pull_request:
    branches: [main]

jobs:
  model-tests:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_CACHE_SYMLINKS: FALSE
      RENV_PATHS_ROOT: ~/.local/share/renv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev build-essential
      - name: Restore R package library from renv.lock
        run: |
          Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
          Rscript -e 'renv::restore()'
      - name: Install CmdStan
        run: |
          Rscript -e 'if (!requireNamespace("cmdstanr", quietly = TRUE)) install.packages("cmdstanr", repos = c("https://mc-stan.org/r-packages/", "https://cloud.r-project.org"))'
          Rscript -e 'cmdstanr::install_cmdstan()'
      - name: Run tests
        run: |
          Rscript -e 'if (requireNamespace("testthat", quietly = TRUE)) testthat::test_dir("tests/testthat") else cat("testthat not available\n")'
