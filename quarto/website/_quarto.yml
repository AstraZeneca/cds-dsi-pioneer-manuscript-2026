project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - "*.qmd"
    - "**/*.qmd"

website:
  title: "PIONEER: SCLC-01 Forecasting"
  description: "Bayesian hierarchical modeling for tumor dynamics and progression-free survival"
  favicon: images/favicon.ico
  navbar:
    background: primary
    left:
      - icon: house-fill
        href: index.qmd
        aria-label: "Home"
      - text: Data
        href: analysis/data-exploration.qmd
      - text: Analysis
        menu:
          - text: Results
          - text: Clinical Endpoints
            href: analysis/clinical-endpoints.qmd
          - text: Survival Analysis
            href: analysis/survival-analysis.qmd
          - text: DCO Comparisons
            href: comparisons/dco-comparisons.qmd
          - text: "---"
          - text: Model Details
          - text: Parameter Inference
            href: analysis/parameter-inference.qmd
          - text: Patient Dynamics
            href: analysis/patient-dynamics.qmd
          - text: "---"
          - text: Validation
          - text: Model Validation
            href: analysis/model-validation.qmd
          - text: Diagnostics
            href: analysis/diagnostics.qmd
      - text: Documentation
        menu:
          - text: Model Architecture
            href: documentation/model-architecture.qmd
          - text: Model Specification
            href: documentation/model-specification.qmd
          - text: Analysis Subgroups
            href: documentation/analysis-subgroups.qmd
          - text: Onboarding Tutorial
            href: documentation/onboarding-tutorial.qmd
          - text: "---"
          - text: Technical Reference
          - text: Targets Pipeline
            href: documentation/targets-pipeline.qmd
          - text: Architecture
            href: documentation/architecture.qmd
          - text: AR(1) Process Noise
            href: documentation/ar1-process-noise.qmd
          - text: Leave-Future-Out Cross-Validation
            href: documentation/leave-future-out-cross-validation.qmd
          - text: "---"
          - text: Extensions
          - text: PSA Adaptation Plan
            href: documentation/psa-adaptation.qmd
    right:
      - icon: file-earmark-slides
        href: https://rstudio-connect.seml.scp.astrazeneca.net/content/084c017e-8ec4-4efd-ae02-e4a86c9dc51f/
        aria-label: "Go/No-Go Presentation"
      - icon: github
        href: https://github.com/azu-oncology-rd/cds-dsi-pioneer-sclc-01-2025
  sidebar:
    - title: "Documentation"
      style: docked
      contents:
        - section: "Getting Started"
          contents:
            - documentation/onboarding-tutorial.qmd
            - documentation/model-architecture.qmd
            - documentation/model-specification.qmd
            - documentation/analysis-subgroups.qmd
        - section: "Technical Reference"
          contents:
            - documentation/targets-pipeline.qmd
            - documentation/architecture.qmd
            - documentation/ar1-process-noise.qmd
            - documentation/leave-future-out-cross-validation.qmd
        - section: "Extensions"
          contents:
            - documentation/psa-adaptation.qmd
    - title: "Data"
      style: docked
      contents:
        - analysis/data-exploration.qmd
    - title: "Analysis"
      style: docked
      contents:
        - section: "Results"
          contents:
            - analysis/clinical-endpoints.qmd
            - analysis/survival-analysis.qmd
            - comparisons/dco-comparisons.qmd
        - section: "Model Details"
          contents:
            - analysis/parameter-inference.qmd
            - analysis/patient-dynamics.qmd
        - section: "Validation"
          contents:
            - analysis/model-validation.qmd
            - analysis/diagnostics.qmd
  page-navigation: true
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "Last updated: {{< meta date-modified >}}"
    center: "PIONEER: SCLC-01 Forecasting"
    right: "Analysis v1.0.0 | DCO3 (Sept 2024)"

metadata-files:
  - _metadata.yml

format:
  html:
    theme:
      light: [cosmo, az-theme.scss]
      dark: [darkly, az-theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-expand: 2
    code-fold: true
    code-tools: true
    code-copy: true
    lightbox: true
    number-sections: true
    fig-cap-location: bottom
    fig-align: center
    fig-responsive: true
    fig-width: 6
    fig-height: 4.5
    out-width: "100%"
    reference-location: margin
    date-format: "MMMM D, YYYY"

bibliography: ../../bib/pioneer.bib

execute:
  freeze: auto
  warning: false
