<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Arial, sans-serif">
  <defs>
    <!-- Gradients for arrows -->
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#830051;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#830051;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="turquoiseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#68D2DF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#68D2DF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F0AB00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#F0AB00;stop-opacity:1"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="600" fill="#ffffff"/>

  <!-- INPUT SECTION -->

  <!-- Expert Knowledge (Plum) -->
  <g transform="translate(50, 80)">
    <!-- Arrow body -->
    <polygon points="0,35 180,35 180,0 250,50 180,100 180,65 0,65" fill="url(#plumGrad)" filter="url(#shadow)"/>
    <!-- Icon: Brain (simplified) -->
    <circle cx="40" cy="50" r="22" fill="white" opacity="0.9"/>
    <text x="40" y="57" text-anchor="middle" font-size="28">🧠</text>
    <!-- Label -->
    <text x="130" y="45" fill="white" font-size="14" font-weight="bold">EXPERT</text>
    <text x="130" y="62" fill="white" font-size="14" font-weight="bold">KNOWLEDGE</text>
  </g>

  <!-- Historical Ph3 Data (Turquoise) -->
  <g transform="translate(50, 240)">
    <!-- Arrow body -->
    <polygon points="0,35 180,35 180,0 250,50 180,100 180,65 0,65" fill="url(#turquoiseGrad)" filter="url(#shadow)"/>
    <!-- Icon: People -->
    <circle cx="40" cy="50" r="22" fill="white" opacity="0.9"/>
    <text x="40" y="57" text-anchor="middle" font-size="24">👥</text>
    <!-- Label -->
    <text x="130" y="45" fill="white" font-size="14" font-weight="bold">HISTORICAL</text>
    <text x="130" y="62" fill="white" font-size="14" font-weight="bold">PH3 DATA</text>
  </g>

  <!-- Target Trial DCO (Gold) -->
  <g transform="translate(50, 400)">
    <!-- Arrow body -->
    <polygon points="0,35 180,35 180,0 250,50 180,100 180,65 0,65" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <!-- Icon: Person with chart -->
    <circle cx="40" cy="50" r="22" fill="white" opacity="0.9"/>
    <text x="40" y="57" text-anchor="middle" font-size="24">📊</text>
    <!-- Label -->
    <text x="130" y="45" fill="#003865" font-size="14" font-weight="bold">TARGET TRIAL</text>
    <text x="130" y="62" fill="#003865" font-size="14" font-weight="bold">LATEST DCO</text>
  </g>

  <!-- CONNECTION LINES -->
  <!-- Curved paths from arrows to center -->
  <path d="M 300 130 Q 450 130 520 280" stroke="#830051" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 300 290 L 520 290" stroke="#68D2DF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 300 450 Q 450 450 520 300" stroke="#F0AB00" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Arrowheads on connection lines -->
  <polygon points="520,280 505,270 505,290" fill="#830051"/>
  <polygon points="520,290 505,280 505,300" fill="#68D2DF"/>
  <polygon points="520,300 505,290 505,310" fill="#F0AB00"/>

  <!-- CENTER: Model Hexagon -->
  <g transform="translate(700, 290)">
    <!-- Hexagon -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="#003865" filter="url(#shadow)"/>
    <!-- Inner glow ring -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#68D2DF" stroke-width="2" opacity="0.6"/>
    <!-- Text -->
    <text x="0" y="-20" text-anchor="middle" fill="white" font-size="13" font-weight="bold">MULTIMODAL</text>
    <text x="0" y="0" text-anchor="middle" fill="white" font-size="13" font-weight="bold">FORECASTING</text>
    <text x="0" y="20" text-anchor="middle" fill="white" font-size="13" font-weight="bold">MODEL</text>
    <!-- Bayesian symbol -->
    <text x="0" y="50" text-anchor="middle" fill="#F0AB00" font-size="18" font-style="italic">β</text>
  </g>

  <!-- OUTPUT ARROW -->
  <path d="M 780 290 L 920 290" stroke="#003865" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="920,290 900,278 900,302" fill="#003865"/>

  <!-- OUTPUT BOX: Forecasted Outcomes -->
  <g transform="translate(940, 170)">
    <rect x="0" y="0" width="380" height="240" rx="10" fill="white" stroke="#003865" stroke-width="3" filter="url(#shadow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="380" height="50" rx="10" fill="#003865"/>
    <rect x="0" y="25" width="380" height="25" fill="#003865"/>
    <text x="190" y="33" text-anchor="middle" fill="white" font-size="16" font-weight="bold">FORECASTED TRIAL OUTCOMES</text>

    <!-- Outcome items -->
    <g transform="translate(20, 70)">
      <!-- mPFS -->
      <rect x="0" y="0" width="100" height="35" rx="5" fill="#830051"/>
      <text x="50" y="23" text-anchor="middle" fill="white" font-size="14" font-weight="bold">mPFS</text>

      <!-- PFS12 -->
      <rect x="115" y="0" width="100" height="35" rx="5" fill="#68D2DF"/>
      <text x="165" y="23" text-anchor="middle" fill="#003865" font-size="14" font-weight="bold">PFS12</text>

      <!-- ORR -->
      <rect x="230" y="0" width="100" height="35" rx="5" fill="#F0AB00"/>
      <text x="280" y="23" text-anchor="middle" fill="#003865" font-size="14" font-weight="bold">ORR</text>
    </g>

    <!-- Description bullets -->
    <g transform="translate(20, 125)" fill="#3F4444" font-size="13">
      <circle cx="8" cy="8" r="4" fill="#F0AB00"/>
      <text x="20" y="12">Endpoint predictions with uncertainty</text>

      <circle cx="8" cy="38" r="4" fill="#F0AB00"/>
      <text x="20" y="42">Subgroup-specific forecasts</text>

      <circle cx="8" cy="68" r="4" fill="#F0AB00"/>
      <text x="20" y="72">Go/No-Go decision support</text>
    </g>
  </g>

  <!-- BOTTOM INFO BOX: Multimodal Data -->
  <g transform="translate(350, 520)">
    <rect x="0" y="0" width="700" height="60" rx="8" fill="#f8f9fa" stroke="#9DB0AC" stroke-width="2"/>
    <text x="20" y="25" fill="#003865" font-size="14" font-weight="bold">MULTIMODAL DATA:</text>
    <text x="170" y="25" fill="#3F4444" font-size="13">Baseline clinical covariates</text>
    <text x="20" y="48" fill="#3F4444" font-size="13">• Time-varying tumor size (SLD)</text>
    <text x="280" y="48" fill="#3F4444" font-size="13">• ctDNA dynamics</text>
    <text x="470" y="48" fill="#3F4444" font-size="13">• Treatment response markers</text>
  </g>

</svg>